<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2d59" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  
  <!-- Background with smooth rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- Physics Atom Orbits -->
  <g transform="translate(96, 96)">
    <!-- Orbit 1 (Horizontal tilt) -->
    <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="url(#orbitGrad1)" stroke-width="4" transform="rotate(-30)" stroke-dasharray="8 3" opacity="0.9" />
    <!-- Orbit 2 (Opposite tilt) -->
    <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="url(#orbitGrad2)" stroke-width="4" transform="rotate(30)" opacity="0.9" />
    <!-- Orbit 3 (Vertical) -->
    <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="#c084fc" stroke-width="4" transform="rotate(90)" stroke-dasharray="12 4" opacity="0.85" />
    
    <!-- Electrons -->
    <circle cx="55" cy="-32" r="6" fill="#38bdf8" filter="drop-shadow(0 0 4px #38bdf8)" />
    <circle cx="-55" cy="32" r="6" fill="#fb923c" filter="drop-shadow(0 0 4px #fb923c)" />
    <circle cx="0" cy="-64" r="6" fill="#c084fc" filter="drop-shadow(0 0 4px #c084fc)" />
    
    <!-- Core Nucleus Glowing -->
    <circle cx="0" cy="0" r="18" fill="url(#coreGrad)" filter="drop-shadow(0 0 10px #38bdf8)" />
    <circle cx="-4" cy="-4" r="5" fill="#ffffff" opacity="0.8" />
  </g>
  
  <!-- Badge Lettering -->
  <text x="96" y="172" text-anchor="middle" font-family="'Outfit', 'Poppins', system-ui, sans-serif" font-weight="900" font-size="19" fill="#f8fafc" letter-spacing="3">FIVIA</text>
</svg>
